name: Deploy SPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without prefix (example: 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Optional release notes"
        required: false
        type: string

concurrency:
  group: deploy-spm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Swift Package
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic versioning like 1.0.0" >&2
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists locally: $VERSION" >&2
            exit 1
          fi

          set +e
          remote_tags="$(git ls-remote --tags origin "refs/tags/$VERSION")"
          remote_status=$?
          set -e

          if [[ $remote_status -ne 0 ]]; then
            echo "Unable to check remote tags" >&2
            exit "$remote_status"
          fi

          if [[ -n "$remote_tags" ]]; then
            echo "Tag already exists on origin: $VERSION" >&2
            exit 1
          fi

      - name: Swift Version
        run: swift --version

      - name: Verify committed DiagramMaker artifact
        run: bash Scripts/verify-diagram-artifact.sh

      - name: Verify remote Cradle consumer by revision
        run: bash Scripts/verify-cradle-consumer.sh revision "$GITHUB_SHA"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set +e
          swift test 2>&1 | tee deploy-test.log
          testStatus=${PIPESTATUS[0]}
          set -e
          exit $testStatus

      - name: Upload deploy test log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-spm-test-log
          path: deploy-test.log
          if-no-files-found: ignore

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Verify remote Cradle consumer by version
        run: bash Scripts/verify-cradle-consumer.sh exact "$VERSION"

      - name: Create GitHub release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        with:
          script: |
            const version = process.env.VERSION;
            const releaseNotes = process.env.RELEASE_NOTES?.trim();
            const body = releaseNotes && releaseNotes.length > 0
              ? releaseNotes
              : [
                  `Swift Package release ${version}`,
                  '',
                  `- Ref: ${context.ref}`,
                  `- Commit: ${context.sha}`,
                ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body,
              generate_release_notes: !releaseNotes,
            });
