name: SwiftPM CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3.3"

      - name: Create log directory
        run: mkdir -p ci-logs

      - name: Verify Swift version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < .swift-version)"
          actual_version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          swift --version | tee ci-logs/swift-version.log
          printf 'expected=%s\nactual=%s\n' "$expected_version" "$actual_version" | tee -a ci-logs/swift-version.log
          test "$actual_version" = "$expected_version"

      - name: Check changed files
        shell: bash
        run: |
          set -euo pipefail
          empty_tree="$(git hash-object -t tree /dev/null)"
          case "${{ github.event_name }}" in
            pull_request)
              git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" | tee ci-logs/diff-check.log
              ;;
            push)
              before_sha="${{ github.event.before }}"
              if git cat-file -e "$before_sha^{commit}" 2>/dev/null; then
                git diff --check "$before_sha..${{ github.sha }}" | tee ci-logs/diff-check.log
              else
                git diff --check "$empty_tree" "${{ github.sha }}" | tee ci-logs/diff-check.log
              fi
              ;;
            *)
              git diff --check "$empty_tree" "${{ github.sha }}" | tee ci-logs/diff-check.log
              ;;
          esac

      - name: Dump package metadata
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package | tee ci-logs/dump-package.log

      - name: Show package dependencies
        shell: bash
        run: |
          set -euo pipefail
          swift package show-dependencies | tee ci-logs/show-dependencies.log

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          swift build -Xswiftc -strict-concurrency=complete | tee ci-logs/build.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          swift test -Xswiftc -strict-concurrency=complete | tee ci-logs/test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-test-logs
          path: ci-logs/
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create log directory
        run: mkdir -p ci-logs

      - name: Verify Swift version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < .swift-version)"
          actual_version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          swift --version | tee ci-logs/swift-version.log
          printf 'expected=%s\nactual=%s\n' "$expected_version" "$actual_version" | tee -a ci-logs/swift-version.log
          test "$actual_version" = "$expected_version"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          swift build -Xswiftc -strict-concurrency=complete | tee ci-logs/build.log

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          swift test -Xswiftc -strict-concurrency=complete | tee ci-logs/test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-test-logs
          path: ci-logs/
          if-no-files-found: warn

  ios:
    name: iOS build-only
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create log directory
        run: mkdir -p ci-logs

      - name: Verify Swift version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(tr -d '[:space:]' < .swift-version)"
          actual_version="$(swift --version | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
          swift --version | tee ci-logs/swift-version.log
          printf 'expected=%s\nactual=%s\n' "$expected_version" "$actual_version" | tee -a ci-logs/swift-version.log
          test "$actual_version" = "$expected_version"

      - name: Build for iOS
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme Cradle \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            build | tee ci-logs/ios-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: ci-logs/
          if-no-files-found: warn
